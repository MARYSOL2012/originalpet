  <rect x="370" y="120" width="60" height="40" rx="5" fill="#7ED321" opacity="0.8"/>
  <text x="400" y="145" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="bold">CONEXIÓN</text>
  
